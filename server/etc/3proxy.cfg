# 3proxy 0.9.9 LTS — TLS explicit proxy for the Chrome VPS Tunnel.
# Paths are inside the container. See docs/runbook-vps.md and ADR-0001 §3.
#
# Security invariants (checked by tests/unit/server-config.test.ts):
#   * TLS listener only, TLS >= 1.2
#   * strong auth for every request, anonymous access impossible
#   * private / loopback / link-local / metadata targets denied before allow
#   * SMTP ports denied; only web ports are reachable
#   * admin and built-in HTTP services are never enabled
#   * logs contain user / host:port / method / status / bytes, never URL paths,
#     query strings or Proxy-Authorization

nserver 1.1.1.1
nserver 8.8.8.8
nscache 65536
timeouts 1 5 30 60 180 1800 15 60
maxconn 200

# One file per day, keep 7 days. The container entrypoint sets umask 077 so the
# files are created 0600. Never log the raw service text: for plain HTTP it is
# the request line and would leak the URL path and query string. The field
# filter (%1-1T) keeps only the method.
log /var/log/3proxy/3proxy.log D
logformat "L%Y-%m-%dT%H:%M:%S%z user=%U dst=%n:%q method=%1-1T status=%E in=%I out=%O ms=%D"
rotate 7

auth strong
users $/etc/3proxy/passwd

# --- Anti-SSRF: deny internal, loopback, link-local and metadata targets. ---
# 169.254.0.0/16 covers the cloud metadata endpoint 169.254.169.254.
deny * * 0.0.0.0/8,10.0.0.0/8,100.64.0.0/10,127.0.0.0/8,169.254.0.0/16,172.16.0.0/12,192.0.0.0/24,192.168.0.0/16,198.18.0.0/15,224.0.0.0/4,240.0.0.0/4 *
deny * * ::1,fc00::/7,fe80::/10 *
# Rendered by scripts/entrypoint.sh from PROXY_PUBLIC_IP and DENY_EXTRA_CIDRS:
# denies connections back to the proxy itself and operator-supplied ranges.
include /tmp/3proxy/acl-extra.cfg

# --- Ports and methods: web only, no SMTP. ---
deny * * * 25,465,587
allow * * * 80,443 HTTP_CONNECT,HTTP_GET,HTTP_POST,HTTP_HEAD,HTTP_PUT,HTTP_OTHER
deny *

# --- Limits: per-user rules come first, then global defaults. ---
# add-user.sh / rotate-user.sh maintain /etc/3proxy/user-limits.cfg.
include /etc/3proxy/user-limits.cfg
connlim 100 0 * * * *

# --- TLS explicit proxy. Clients connect to https://<domain>:443. ---
ssl_server_cert /etc/3proxy/certs/fullchain.pem
ssl_server_key /etc/3proxy/certs/privkey.pem
ssl_server_min_proto_version TLSv1.2
ssl_serv
proxy -p3129 -i0.0.0.0
ssl_noserv
